<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1411" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Komu koľko">
<title>Komu koľko</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    /* green plays three separate roles; they diverge in dark mode, so they are
       separate tokens: a fill, its pressed state, and a readable text colour */
    --green:#2e7d5b; --green-press:#206045; --green-ink:#206045; --green-soft:#eaf3ee;
    --bg:#f5f7f6; --card:#ffffff; --field:#ffffff;
    --text:#16211c; --muted:#65736a; --line:#e3e9e5;
    --red:#c0442f; --red-soft:#fbeae7; --amber:#b07908; --amber-soft:#fdecc8;
    --pop-bg:#16211c; --pop-fg:#ffffff; --focus:rgba(46,125,91,.13); --on-green:#ffffff;
    /* One type scale for the whole app. Inputs stay at 16px on purpose: iOS
       Safari zooms the page when focusing anything smaller. */
    --fs-xs:.75rem;     /* 12 – tab bar, badge */
    --fs-sm:.8125rem;   /* 13 – sub-labels, hints, popups */
    --fs-md:.875rem;    /* 14 – secondary body, chips, history */
    --fs-base:.9375rem; /* 15 – body */
    --fs-input:1rem;    /* 16 – form fields only */
    --fs-lg:1.0625rem;  /* 17 – primary action, page title */
    --fs-xl:1.75rem;    /* 28 – the running total */
    --r-sm:10px; --r-md:14px; --r-full:999px;
  }
  /* Follows the phone's own setting, so nobody gets a surprise. Only the colour
     tokens are redefined – every rule above is written against them. */
  @media (prefers-color-scheme: dark){
    :root{
      --green:#5fbb8e; --green-press:#4da87c; --green-ink:#6fc79c; --green-soft:#1b2b23;
      --bg:#0f1411; --card:#161c19; --field:#1b221e;
      --text:#e6ebe8; --muted:#93a39b; --line:#27302b;
      --red:#e8705c; --red-soft:#2e1d19; --amber:#d9a441; --amber-soft:#2d2415;
      --pop-bg:#e6ebe8; --pop-fg:#0f1411; --focus:rgba(95,187,142,.25); --on-green:#0d1512;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--fs-base);
    line-height:1.45; -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
  }
  /* money should line up in columns wherever it is shown */
  .amt,.big,.val,.owe,.hist,.result,.summary{font-variant-numeric:tabular-nums;}
  /* neutral chrome, green reserved for actions and active state */
  header{
    background:var(--card); color:var(--text); padding:13px 16px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:10;
  }
  header h1{font-size:var(--fs-lg); margin:0; font-weight:650; letter-spacing:-.015em;}
  #badge{
    font-size:var(--fs-xs); padding:5px 11px; border-radius:var(--r-full); cursor:pointer;
    background:var(--bg); color:var(--muted); border:1px solid var(--line);
    display:inline-flex; align-items:center; gap:5px; font-family:inherit;
    transition:background-color .15s ease, color .15s ease;
  }
  #badge.ok{background:var(--green-soft); color:var(--green-ink);}
  #badge.off{background:var(--amber-soft); color:var(--amber);}
  main{padding:14px; max-width:560px; margin:0 auto;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    padding:16px; margin-bottom:12px;
  }
  .card h2{
    font-size:var(--fs-md); margin:0 0 12px; color:var(--muted); font-weight:600;
    letter-spacing:0;
  }
  label{font-size:var(--fs-sm); color:var(--muted); display:block; margin-bottom:5px;}
  input,select{
    font-size:var(--fs-input); padding:11px 12px; border:1px solid var(--line);
    border-radius:var(--r-sm); width:100%; background:var(--field); color:var(--text);
    font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease;
  }
  /* the field itself must stay 16px, but its placeholder is a hint, not content */
  input::placeholder,textarea::placeholder{font-size:var(--fs-md); color:var(--muted); opacity:.75;}
  input:focus,select:focus{
    outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--focus);
  }
  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--line); background:var(--field); border-radius:var(--r-full);
    padding:9px 14px; font-size:var(--fs-md); cursor:pointer; color:var(--text);
    font-family:inherit; transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip.on{background:var(--green); border-color:var(--green); color:var(--on-green);}
  .chip .p{opacity:.7; font-size:var(--fs-sm);}
  .chip.sm{padding:5px 11px; font-size:var(--fs-sm);}
  .scanitem{padding:8px 0; border-bottom:1px solid var(--line);}
  .scanitem:last-child{border-bottom:none;}
  .si-top{display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .scanitem .chips{margin-top:6px;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{
    width:40px; height:40px; border-radius:var(--r-sm); border:1px solid var(--line);
    background:var(--field); font-size:1.15rem; cursor:pointer; color:var(--green-ink); flex:none;
    font-family:inherit; transition:background-color .15s ease, border-color .15s ease;
  }
  .stepper button:active{background:var(--green-soft); border-color:var(--green);}
  .stepper .val{min-width:46px; text-align:center; font-weight:600; font-size:var(--fs-base);}
  .famrow{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line);}
  .famrow:last-child{border-bottom:none;}
  .btn{
    display:block; width:100%; padding:14px; border:none; border-radius:var(--r-sm);
    background:var(--green); color:var(--on-green); font-size:var(--fs-lg); font-weight:600; cursor:pointer;
    font-family:inherit; letter-spacing:-.01em; transition:background-color .15s ease;
  }
  .btn:active{background:var(--green-press);}
  .btn.small{width:auto; padding:9px 14px; font-size:var(--fs-md); display:inline-flex; align-items:center; gap:6px;}
  .btn.ghost{background:var(--green-soft); color:var(--green-ink);}
  .btn.danger{background:var(--red-soft); color:var(--red);}
  .summary{font-size:var(--fs-base);}
  .summary .big{font-size:var(--fs-xl); font-weight:650; color:var(--text); letter-spacing:-.02em; line-height:1.2;}
  .owe{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:8px;}
  .owe:last-child{border-bottom:none;}
  .owe .amt{font-weight:700; color:var(--green-ink); white-space:nowrap;}
  .hist{font-size:var(--fs-md); padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .hist:last-child{border-bottom:none;}
  .hist .sub{color:var(--muted); font-size:var(--fs-sm);}
  .x{border:none; background:none; color:var(--red); font-size:var(--fs-lg); cursor:pointer; padding:4px 8px; flex:none;
     display:inline-flex; align-items:center;}
  .muted{color:var(--muted); font-size:var(--fs-md);}
  .listrow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .listrow input{flex:1;}
  .listrow input.price{max-width:90px;}
  nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; z-index:10;
    background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; border:none; background:none; padding:10px 0 8px; font-size:var(--fs-xs);
    color:var(--muted); cursor:pointer; font-family:inherit;
    transition:color .15s ease;
  }
  nav button.on{color:var(--green-ink); font-weight:600;}
  nav button .ico{display:block; margin-bottom:3px;}
  nav button .ico .i{width:21px; height:21px;}
  textarea{width:100%; min-height:90px; border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; font-size:var(--fs-md); font-family:inherit;}
  .result{background:var(--green-soft); border-radius:var(--r-sm); padding:13px; margin-top:12px; font-size:var(--fs-md);}
  .result div{padding:3px 0;}
  .spacer{height:10px;}
  .photorow{display:flex; gap:12px; align-items:center;}
  .thumb{width:72px; height:72px; object-fit:cover; border-radius:10px; border:1px solid var(--line); flex:none;}
  .hist .note{color:var(--text); font-style:italic;}
  .hist a.sub{color:var(--green-ink); text-decoration:none; display:inline-block; margin-top:2px;}
  /* The (i) popup spans its row (heading or button row) rather than hanging off
     the icon, so it can never run past the card – and therefore never off screen. */
  .card h2.ttl, .inforow{display:flex; justify-content:space-between; align-items:center; gap:8px; position:relative;}
  .inforow{margin-top:6px;}
  .btnrow{display:flex; flex-wrap:wrap; gap:8px;}
  .info{display:inline-block; text-transform:none;}
  .info-ico{
    width:18px; height:18px; border-radius:50%; border:1.5px solid var(--muted); background:var(--field);
    color:var(--muted); font:italic 700 .72rem/1 Georgia,serif; letter-spacing:0;
    cursor:pointer; padding:0; display:inline-flex; align-items:center; justify-content:center;
    vertical-align:middle; flex:none;
  }
  .info-pop{
    display:none; position:absolute; top:100%; left:0; right:0; z-index:20; margin-top:6px;
    background:var(--pop-bg); color:var(--pop-fg); font-size:var(--fs-sm); font-weight:400; text-transform:none;
    letter-spacing:normal; line-height:1.45; border-radius:var(--r-sm); padding:11px 13px;
    box-shadow:0 6px 20px rgba(0,0,0,.16);
  }
  .info-pop.show{display:block;}
  /* inline icon set – monochrome, inherits the surrounding text colour */
  .i{width:1.05em; height:1.05em; flex:none; vertical-align:-.16em;}
  .spin{animation:spin 1s linear infinite; transform-origin:50% 50%;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Kto, komu, koľko...</h1>
  <button id="badge" onclick="syncNow()">…</button>
</header>
<main>
  <div id="tab-meal"></div>
  <div id="tab-balances" style="display:none"></div>
  <div id="tab-settings" style="display:none"></div>
</main>
<nav>
  <button data-tab="meal" class="on"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>Nová položka</button>
  <button data-tab="balances"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg></span>Zostatky</button>
  <button data-tab="settings"><span class="ico"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></span>Nastavenia</button>
</nav>
<script>
"use strict";

/* ---------- PWA service worker ---------- */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("./sw.js");
}

/* ---------- storage & state ---------- */
const DEFAULT_SYNC_URL = "https://script.google.com/macros/s/AKfycbz0AfCGqU27goiraoFc0Q-Ea8N7mh0821J3jyKhUSZnXpjxqGUw9xtUGVKwfTVweKLY/exec";

function loadLS(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
/* Returns false when the browser quota is full – a queued receipt photo is the
   only payload big enough to hit it, and the caller warns instead of dying. */
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function defaultSettings(){
  return {
    currency:"€", syncUrl:DEFAULT_SYNC_URL, updatedAt:0,
    families:["Baba Soňa","Hupčíkovci","Gazdovci"],
    components:[
      {name:"Polievka",price:0.80},
      {name:"Hlavné – kuracie/bravčové",price:2.50},
      {name:"Hlavné – hovädzie",price:4.00},
      {name:"Hlavné – vegetariánske",price:1.80},
      {name:"Príloha (zemiaky/ryža/cestoviny)",price:0.60},
      {name:"Šalát / kompót",price:0.70},
      {name:"Koláč / zmrzlina",price:0.50},
      {name:"Nápoje - nealko",price:0.50},
      {name:"Nápoje - alko",price:1.00}
    ]
  };
}
let S = Object.assign(defaultSettings(), loadLS("ms_settings", {}));
if(!S.syncUrl) S.syncUrl = DEFAULT_SYNC_URL;
let PASS = loadLS("ms_pass", "");
let ledger = loadLS("ms_ledger", []);
let queue  = loadLS("ms_queue", []);
let currentTab = "meal";
let meal = null; // current meal form state

/* ---------- icons ----------
   Inline SVG (no icon font / CDN): the app must keep working offline, and
   stroke="currentColor" keeps every icon monochrome with its surrounding text. */
const ICONS = {
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  note:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkCircle:'<path d="M21.8 10A10 10 0 1 1 17 3.34"/><path d="m9 11 3 3L22 4"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  banknote:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01"/><path d="M18 12h.01"/>',
  spinner:'<path d="M12 3a9 9 0 1 0 9 9" />'
};
function ico(name, cls){
  return `<svg class="i ${cls||""}" viewBox="0 0 24 24" fill="none" stroke="currentColor"`
    + ` stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round2 = n => Math.round(n*100)/100;
const fmt = n => S.currency + round2(n).toFixed(2);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* Settings are saved locally AND pushed to the Sheet (Settings tab).
   Newest updatedAt wins across devices. */
let settingsPushTimer = null;
function saveSettings(){
  S.updatedAt = Date.now();
  saveLS("ms_settings", S);
  clearTimeout(settingsPushTimer);
  settingsPushTimer = setTimeout(()=>{
    queue = queue.filter(q=>q.action!=="saveSettings");
    saveLS("ms_queue", queue);
    sendOrQueue({action:"saveSettings", settings:S});
  }, 800);
}
function adoptServerSettings(s){
  S = Object.assign(defaultSettings(), s);
  if(!S.syncUrl) S.syncUrl = DEFAULT_SYNC_URL;
  saveLS("ms_settings", S);
  meal = null;
}
function saveLedger(){ saveLS("ms_ledger",ledger); }

/* ---------- sync ---------- */
function setBadge(mode){
  const b = $("#badge");
  if(mode==="local"){ b.textContent="Len lokálne"; b.className=""; }
  else if(mode==="sync"){ b.innerHTML=ico("spinner","spin")+"Synchronizuje sa…"; b.className=""; }
  else if(mode==="ok"){ b.innerHTML=ico("check")+"Synchronizované"; b.className="ok"; }
  else { b.textContent="Offline ("+queue.length+" čaká)"; b.className="off"; }
}
async function apiGet(){
  const r = await fetch(S.syncUrl + "?action=list&token=" + encodeURIComponent(PASS), {method:"GET"});
  return r.json();
}
async function apiPost(body){
  const payload = Object.assign({token:PASS}, body);
  const r = await fetch(S.syncUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
  return r.json();
}
function askPass(msg){
  const p = prompt(msg || "Zadajte rodinné heslo na synchronizáciu:");
  if(!p) return false;
  PASS = p.trim(); saveLS("ms_pass", PASS);
  return true;
}
function applyQueue(list){
  let out = list.slice();
  for(const q of queue){
    if(q.action==="add"){
      const {photoB64, photoMime, ...rest} = q.entry; // base64 never enters the local ledger
      // a queued entry can already be on the server (its reply was lost), so
      // don't show it twice while the queue drains
      if(!out.some(e=>e.id===rest.id)) out.push(rest);
    }
    else if(q.action==="delete") out = out.filter(e=>e.id!==q.id);
  }
  return out;
}
let passRetried = false;
let syncing = false;
/* syncNow fires from four places (load, the online event, the badge, opening
   Zostatky). Two overlapping runs would both read queue[0] and both POST it
   before either shifted it off, writing the same entry twice. */
async function syncNow(){
  if(syncing) return;
  syncing = true;
  try{ await syncRun(); }
  finally{ syncing = false; }
}
async function syncRun(){
  if(!S.syncUrl){ setBadge("local"); return; }
  if(!PASS && !askPass()){ setBadge("off"); return; }
  setBadge("sync");
  try{
    while(queue.length){
      const res = await apiPost(queue[0]);
      if(!res.ok) throw new Error(res.error||"post failed");
      queue.shift(); saveLS("ms_queue",queue);
    }
    const res = await apiGet();
    if(!res.ok) throw new Error(res.error||"list failed");
    ledger = applyQueue(res.entries||[]);
    saveLedger();
    if(res.settings && (res.settings.updatedAt||0) > (S.updatedAt||0)){
      adoptServerSettings(res.settings);
      if(currentTab==="meal") renderMeal();
      renderSettings();
    }
    passRetried = false;
    setBadge("ok");
  }catch(e){
    if(/unauthorized/i.test(String(e.message)) && !passRetried){
      passRetried = true;
      if(askPass("Nesprávne heslo. Zadajte rodinné heslo:")) return syncRun(); // not syncNow: the mutex is held

    }
    setBadge("off");
  }
  if(currentTab==="balances") renderBalances();
}
async function sendOrQueue(body){
  if(!S.syncUrl) return;
  try{
    const res = await apiPost(body);
    if(!res.ok) throw new Error(res.error||"failed");
    setBadge("ok");
  }catch(e){
    queue.push(body);
    if(!saveLS("ms_queue",queue) && body.entry && body.entry.photoB64){
      delete body.entry.photoB64; delete body.entry.photoMime;
      saveLS("ms_queue",queue);
      alert("Málo miesta v prehliadači – záznam sa uloží, ale účtenka sa nepriloží.");
    }
    setBadge("off");
  }
}
/* The local ledger keeps the small entry; only the outgoing copy carries the
   photo. The server answers with photoId/photoUrl on the next sync. */
function pushEntry(entry, photo){
  ledger.push(entry); saveLedger();
  sendOrQueue({action:"add", entry: photo ? Object.assign({}, entry, photo) : entry});
}
function deleteEntry(id){ ledger = ledger.filter(e=>e.id!==id); saveLedger(); sendOrQueue({action:"delete", id}); }

/* ---------- balance math ---------- */
function computeBalances(){
  const m = {}; // "from|to" -> amount owed
  const add = (k,v)=>{ m[k]=(m[k]||0)+v; };
  for(const e of ledger){
    if(e.kind==="meal"){
      for(const f in (e.shares||{})){
        const amt = e.shares[f];
        if(f!==e.payer && amt>0.004) add(f+"|"+e.payer, amt);
      }
    }else if(e.kind==="settlement"){
      add(e.from+"|"+e.to, -e.amount);
    }
  }
  const pairs=[], seen=new Set();
  for(const k of Object.keys(m)){
    const [a,b]=k.split("|");
    const key=[a,b].sort().join("|");
    if(seen.has(key)) continue; seen.add(key);
    const net=(m[a+"|"+b]||0)-(m[b+"|"+a]||0);
    if(net>0.004) pairs.push({from:a,to:b,amount:round2(net)});
    else if(net<-0.004) pairs.push({from:b,to:a,amount:round2(-net)});
  }
  pairs.sort((x,y)=>y.amount-x.amount);
  return pairs;
}

/* ---------- meal tab ---------- */
function newMealState(){
  const portions={}; S.families.forEach(f=>portions[f]=0);
  const amounts={};  S.families.forEach(f=>amounts[f]=0);
  // mode: "portions" = odhad podľa porcií a cien, "sums" = konkrétne sumy z účtu,
  //       "scan" = naskenovaný účet s priradením položiek rodinám
  return {date:today(), payer:"", mode:"portions", sel:new Set(), custom:[], portions, amounts, override:"",
          items:null, scanTotal:null, scanBusy:false, note:"", photo:null};
}

/* ---------- bill scan & photo helpers ----------
   Vracia dve veľkosti: b64 na odoslanie a malý preview do náhľadu. Náhľad musí
   byť malý – v režime skenu sa formulár prekresľuje pri každom ťuknutí. */
function processPhoto(file, cb, maxDim, quality){
  const img=new Image();
  img.onload=()=>{
    const encode=(dim,q)=>{
      const sc=Math.min(1, dim/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      return c.toDataURL("image/jpeg",q);
    };
    const full=encode(maxDim||1600, quality||0.85);
    const preview=encode(200,0.6);
    URL.revokeObjectURL(img.src);
    cb(full.split(",")[1], preview);
  };
  img.onerror=()=>{ URL.revokeObjectURL(img.src); alert("Obrázok sa nepodarilo načítať."); meal.scanBusy=false; renderMeal(); };
  img.src=URL.createObjectURL(file);
}
/* Priloženie bez skenovania: menší obrázok, aby sa zmestil do fronty pri
   offline uložení. */
function attachPhoto(file){
  processPhoto(file, (b64,preview)=>{
    meal.photo={b64, mime:"image/jpeg", preview};
    renderMeal();
  }, 1200, 0.7);
}
function scanBillImage(file){
  meal.scanBusy=true; renderMeal();
  processPhoto(file, async (b64,preview)=>{
    try{
      const res=await apiPost({action:"scanBill", image:b64, mime:"image/jpeg"});
      if(!res.ok) throw new Error(res.error||"skenovanie zlyhalo");
      meal.items=(res.items||[]).map(it=>({name:it.name, price:it.price, fam:null}));
      meal.scanTotal=res.total;
      meal.photo={b64, mime:"image/jpeg", preview}; // naskenovaný účet sa rovno priloží
    }catch(e){
      alert("Skenovanie zlyhalo: "+e.message);
    }
    meal.scanBusy=false; renderMeal();
  });
}
/* Súčty za rodiny zo skenovaných položiek. fam==="*" = Spoločné –
   rozdelí sa rovným dielom medzi rodiny s aspoň jednou vlastnou položkou. */
function scanShares(){
  const totals={}; let unassigned=0; const shared=[];
  for(const it of (meal.items||[])){
    if(it.fam==="*") shared.push(it.price);
    else if(it.fam) totals[it.fam]=(totals[it.fam]||0)+it.price;
    else unassigned++;
  }
  const participants=Object.keys(totals);
  const sharedSum=shared.reduce((a,b)=>a+b,0);
  if(participants.length && sharedSum){
    const per=sharedSum/participants.length;
    participants.forEach(f=>totals[f]+=per);
  }
  for(const f in totals) totals[f]=round2(totals[f]);
  return {totals, unassigned, sharedSum:round2(sharedSum), participants};
}

function mealCalc(){
  if(meal.mode==="scan"){
    const s=scanShares();
    const shares={}; let total=0;
    for(const f in s.totals){
      if(s.totals[f]>0.004){ shares[f]=s.totals[f]; total+=s.totals[f]; }
    }
    return {perPerson:0, totalPortions:0, total:round2(total), shares, unassigned:s.unassigned};
  }
  if(meal.mode==="sums"){
    const shares={}; let total=0;
    for(const f in meal.amounts){
      const a=round2(meal.amounts[f]||0);
      if(a>0){ shares[f]=a; total+=a; }
    }
    return {perPerson:0, totalPortions:0, total:round2(total), shares};
  }
  let perPerson=0;
  meal.sel.forEach(i=>{ if(S.components[i]) perPerson+=S.components[i].price; });
  meal.custom.forEach(c=>perPerson+=c.price);
  const totalPortions = Object.values(meal.portions).reduce((a,b)=>a+b,0);
  const ov = parseFloat(meal.override);
  const total = (!isNaN(ov)&&ov>0) ? ov : perPerson*totalPortions;
  const shares={};
  if(totalPortions>0){
    for(const f in meal.portions){
      if(meal.portions[f]>0) shares[f]=round2(total*meal.portions[f]/totalPortions);
    }
  }
  return {perPerson, totalPortions, total, shares};
}
function updateSummary(){
  const box=$("#m-summary"); if(!box) return; // v režime skenu bez položiek sa súhrn nezobrazuje
  const c=mealCalc();
  const owes = meal.payer
    ? Object.keys(c.shares).filter(f=>f!==meal.payer)
        .map(f=>`<div>${esc(f)} → ${esc(meal.payer)}: <b>${fmt(c.shares[f])}</b></div>`).join("")
    : '<div class="muted">Vyberte, kto platil / varil.</div>';
  if(meal.mode==="scan"){
    const mismatch = meal.scanTotal!=null && !c.unassigned && Math.abs(meal.scanTotal-c.total)>0.011;
    box.innerHTML = `
      <div class="big">${fmt(c.total)}</div>
      ${meal.scanTotal!=null?`<div>Na účte: <b>${fmt(meal.scanTotal)}</b>${mismatch?` <span class="muted">${ico("alert")} nesedí s priradenými položkami</span>`:" "+ico("check")}</div>`:""}
      ${c.unassigned?`<div class="muted">${ico("alert")} Nepriradené položky: ${c.unassigned}</div>`:""}
      ${owes || '<div class="muted">Prirad položky rodinám, aby si videl, kto koľko dlží.</div>'}`;
    return;
  }
  if(meal.mode==="sums"){
    $("#m-summary").innerHTML = `
      <div class="big">${fmt(c.total)}</div>
      <div class="muted">Porovnaj s celkovou sumou na účte.</div>
      ${owes || '<div class="muted">Pridaj sumy, aby si videl, kto koľko dlží.</div>'}`;
    return;
  }
  $("#m-summary").innerHTML = `
    <div>Na osobu: <b>${fmt(c.perPerson)}</b> · Porcie: <b>${c.totalPortions}</b></div>
    <div class="big">${fmt(c.total)}</div>
    ${owes || '<div class="muted">Pridaj porcie, aby si videl, kto koľko dlží.</div>'}`;
}
function saveMeal(){
  if(!meal.payer){ alert("Vyberte, kto platil / varil."); return; }
  const c=mealCalc();
  if(meal.mode==="scan"){
    if(!meal.items||!meal.items.length){ alert("Najprv naskenujte účet."); return; }
    if(c.unassigned>0){ alert("Priraďte všetky položky (nepriradené: "+c.unassigned+")."); return; }
    if(c.total<=0){ alert("Suma účtu musí byť kladná."); return; }
  }else if(meal.mode==="sums"){
    if(c.total<=0){ alert("Zadajte aspoň jednu sumu."); return; }
  }else{
    if(c.totalPortions<=0){ alert("Zadajte aspoň jednu porciu."); return; }
    if(c.total<=0){ alert("Vyberte položky jedla alebo zadajte celkovú sumu."); return; }
  }
  const desc = meal.mode==="sums" ? "Účet – konkrétne sumy"
    : meal.mode==="scan" ? "Účet – sken"
    : ([...meal.sel].map(i=>S.components[i].name).concat(meal.custom.map(x=>x.name)).join(", ")||"Jedlo");
  const entry={
    id:uid(), kind:"meal", mode:meal.mode, date:meal.date, payer:meal.payer, desc,
    perPerson:round2(c.perPerson), total:round2(c.total),
    portions:Object.fromEntries(Object.entries(meal.portions).filter(([,v])=>v>0)),
    shares:c.shares
  };
  if(meal.mode==="scan") entry.items = meal.items.map(it=>({name:it.name, price:it.price, fam:it.fam}));
  if(meal.note.trim()) entry.note = meal.note.trim();
  pushEntry(entry, meal.photo ? {photoB64:meal.photo.b64, photoMime:meal.photo.mime} : null);
  const owes=Object.keys(c.shares).filter(f=>f!==meal.payer);
  const html = `<div class="result"><b>${ico("check")} Uložené</b>
    ${entry.note?`<div>${ico("note")} ${esc(entry.note)}</div>`:""}
    ${meal.photo?`<div>${ico("camera")} Účtenka sa ukladá…</div>`:""}
    ${owes.map(f=>`<div>${esc(f)} platí ${esc(meal.payer)} <b>${fmt(c.shares[f])}</b></div>`).join("")||"<div>Nič sa nedlží – platiteľ jedol sám.</div>"}
  </div>`;
  meal=newMealState(); renderMeal();
  $("#m-result").innerHTML=html;
}

        <span class="amt">${fmt(p.amount)}</span>
        <button class="btn small ghost" data-settle="${i}">Vyrovnať</button>
      </div>`).join("") : `<div class="muted">${ico("checkCircle")} Všetko vyrovnané</div>`}
  </div>
  <div class="card">
    <h2>História (${hist.length})</h2>
    ${hist.map(e=> e.kind==="meal" ? `
      <div class="hist"><div>
        <div><b>${esc(e.payer)}</b> zaplatil(a) ${fmt(e.total)} — ${esc(e.desc||"")}</div>
        <div class="sub">${esc(e.date||"")} · ${(e.mode==="sums"||e.mode==="scan")
          ? Object.entries(e.shares||{}).map(([f,v])=>esc(f)+": "+fmt(v)).join(", ")
          : Object.entries(e.portions||{}).map(([f,v])=>esc(f)+": "+v).join(", ")}</div>
        ${histExtras(e)}
      </div><button class="x" data-del="${e.id}">${ico("x")}</button></div>` : `
      <div class="hist"><div>
        <div>${ico("banknote")} <b>${esc(e.from)}</b> zaplatil(a) <b>${esc(e.to)}</b> ${fmt(e.amount)}</div>
        <div class="sub">${esc(e.date||"")} · vyrovnanie</div>
        ${histExtras(e)}
      </div><button class="x" data-del="${e.id}">${ico("x")}</button></div>`).join("") || '<div class="muted">Zatiaľ žiadne jedlá.</div>'}
  </div>`;
  $("#tab-balances").onclick = e=>{
    const s=e.target.closest("[data-settle]");
    if(s){
      const p=pairs[+s.dataset.settle];
      const v=prompt(`Koľko zaplatil(a) ${p.from} pre ${p.to}?`, p.amount.toFixed(2));
      if(v===null) return;
      const amt=parseFloat(v);
      if(isNaN(amt)||amt<=0){ alert("Neplatná suma"); return; }
      const n=prompt("Poznámka k platbe (voliteľné):","");
      const st={id:uid(), kind:"settlement", date:today(), from:p.from, to:p.to, amount:round2(amt)};
      if(n && n.trim()) st.note=n.trim();
      pushEntry(st);
      renderBalances(); return;
    }
    const d=e.target.closest("[data-del]");
    if(d && confirm("Odstrániť tento záznam?")){ deleteEntry(d.dataset.del); renderBalances(); }
  };
}

/* ---------- settings tab ---------- */
function renderSettings(){
  $("#tab-settings").innerHTML = `
  <div class="card">
    <h2>Synchronizácia s Google Sheet</h2>
    <label>Rodinné heslo</label>
    <input id="s-pass" value="${esc(PASS)}" placeholder="rovnaké ako v Apps Scripte">
    <div class="spacer"></div>
    <label>URL webovej aplikácie Apps Script</label>
    <input id="s-url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.syncUrl)}">
    <div class="spacer"></div>
    <button class="btn small" id="s-testurl">Uložiť a otestovať pripojenie</button>
    <div class="muted" id="s-urlmsg" style="margin-top:6px">${S.syncUrl?"":"URL nie je nastavená – dáta zostávajú len na tomto zariadení."}</div>
  </div>
  <div class="card">
    <h2>Rodiny</h2>
    <div id="s-fams">${S.families.map((f,i)=>`
      <div class="listrow"><input value="${esc(f)}" data-fam="${i}"><button class="x" data-delfam="${i}">${ico("x")}</button></div>`).join("")}
    </div>
    <button class="btn small ghost" id="s-addfam">+ Pridať rodinu</button>
  </div>
  <div class="card">
    <h2 class="ttl">Predvolené ceny na osobu <span class="info"><button type="button" class="info-ico" aria-label="Ako sa synchronizujú?">i</button><span class="info-pop">Ceny, rodiny a mena sa synchronizujú cez Google Sheet na všetky zariadenia.</span></span></h2>
    <div id="s-comps">${S.components.map((c,i)=>`
      <div class="listrow">
        <input value="${esc(c.name)}" data-cname="${i}">
        <input class="price" type="number" step="0.1" min="0" value="${c.price}" data-cprice="${i}">
        <button class="x" data-delcomp="${i}">${ico("x")}</button>
      </div>`).join("")}
    </div>
    <button class="btn small ghost" id="s-addcomp">+ Pridať položku</button>
    <div class="spacer"></div>
    <label>Symbol meny</label>
    <input id="s-curr" value="${esc(S.currency)}" style="max-width:90px">
  </div>`;

  /* ===== ZAKOMENTOVANÉ (júl 2026): karta „Záloha" už nie je potrebná =====
     Export/import slúžil na ručný prenos dát medzi zariadeniami v čase,
     keď dáta žili len lokálne v telefóne. Odkedy sa záznamy aj nastavenia
     synchronizujú cez Google Sheet, nové zariadenie stačí otvoriť a zadať
     heslo – všetko sa stiahne samo. „Vymazať lokálne dáta" bolo tiež
     zbytočné: po vymazaní sa dáta okamžite obnovili zo Sheetu.
     Oživenie: vlož tento HTML späť do template stringu vyššie a odkomentuj
     obsluhy s-export / s-import / s-wipe na konci tejto funkcie.

  <div class="card">
    <h2>Záloha (dáta tohto zariadenia)</h2>
    <button class="btn small ghost" id="s-export">Kopírovať exportný kód</button>
    <button class="btn small ghost" id="s-import">Vložiť importný kód</button>
    <div class="spacer"></div>
    <button class="btn small danger" id="s-wipe">Vymazať lokálne dáta</button>
  </div>
  ===== koniec zakomentovaného HTML ===== */

  $("#s-testurl").onclick = async ()=>{
    S.syncUrl = $("#s-url").value.trim(); saveLS("ms_settings",S);
    PASS = $("#s-pass").value.trim(); saveLS("ms_pass",PASS);
    const msg=$("#s-urlmsg");
    if(!S.syncUrl){ msg.textContent="URL vymazaná – lokálny režim."; setBadge("local"); return; }
    msg.textContent="Testuje sa…";
    try{
      const res=await apiGet();
      if(res.ok){ msg.innerHTML=ico("check")+" Pripojené! "+(res.entries||[]).length+" záznamov v hárku."; syncNow(); }
      else msg.innerHTML=ico("x")+" Skript vrátil chybu: "+esc(res.error||"neznáma");
    }catch(e){ msg.innerHTML=ico("alert")+" Nepodarilo sa pripojiť. Skontrolujte URL a nasadenie (prístup: Ktokoľvek)."; }
  };
  $("#tab-settings").onchange = e=>{
    const t=e.target;
    if(t.id==="s-pass"){ PASS=t.value.trim(); saveLS("ms_pass",PASS); return; }
    if(t.id==="s-url") return; // saved via test button
    if(t.dataset.fam!==undefined){ const v=t.value.trim(); if(v) S.families[+t.dataset.fam]=v; }
    if(t.dataset.cname!==undefined){ S.components[+t.dataset.cname].name=t.value.trim()||"Položka"; }
    if(t.dataset.cprice!==undefined){ S.components[+t.dataset.cprice].price=Math.max(0,parseFloat(t.value)||0); }
    if(t.id==="s-curr"){ S.currency=t.value||"€"; }
    saveSettings(); meal=null;
  };
  $("#tab-settings").onclick = e=>{
    const df=e.target.closest("[data-delfam]");
    if(df){ if(S.families.length<=1){alert("Ponechajte aspoň jednu rodinu.");return;}
      S.families.splice(+df.dataset.delfam,1); saveSettings(); meal=null; renderSettings(); return; }
    const dc=e.target.closest("[data-delcomp]");
    if(dc){ S.components.splice(+dc.dataset.delcomp,1); saveSettings(); meal=null; renderSettings(); return; }
  };
  $("#s-addfam").onclick = ()=>{
    const n=prompt("Názov rodiny:"); if(!n) return;
    if(S.families.includes(n.trim())){ alert("Názov už existuje."); return; }
    S.families.push(n.trim()); saveSettings(); meal=null; renderSettings();
  };
  $("#s-addcomp").onclick = ()=>{
    const n=prompt("Názov položky:"); if(!n) return;
    const p=parseFloat(prompt("Cena na osobu ("+S.currency+"):")||"");
    if(isNaN(p)||p<0){ alert("Neplatná cena"); return; }
    S.components.push({name:n.trim(),price:p}); saveSettings(); meal=null; renderSettings();
  };
  /* ===== ZAKOMENTOVANÉ (júl 2026): obsluhy tlačidiel karty „Záloha" =====
     Zbytočné od zavedenia synchronizácie cez Google Sheet (pozri komentár
     pri zakomentovanom HTML vyššie). Ak kartu oživíš, odkomentuj aj toto.

  $("#s-export").onclick = async ()=>{
    const code=JSON.stringify({settings:S, ledger, queue, pass:PASS});
    try{ await navigator.clipboard.writeText(code); alert("Exportný kód skopírovaný do schránky. Vložte ho na druhom zariadení pomocou 'Vložiť importný kód'."); }
    catch(e){ prompt("Skopírujte tento kód:", code); }
  };
  $("#s-import").onclick = ()=>{
    const code=prompt("Vložte exportný kód:"); if(!code) return;
    try{
      const d=JSON.parse(code);
      if(d.settings) { S=Object.assign(defaultSettings(),d.settings); saveLS("ms_settings",S); }
      if(d.ledger){ ledger=d.ledger; saveLedger(); }
      if(d.queue){ queue=d.queue; saveLS("ms_queue",queue); }
      if(d.pass){ PASS=d.pass; saveLS("ms_pass",PASS); }
      meal=null; alert("Importované ✓"); renderSettings(); syncNow();
    }catch(e){ alert("Neplatný kód."); }
  };
  $("#s-wipe").onclick = ()=>{
    if(!confirm("Vymazať VŠETKY lokálne dáta na tomto zariadení? (Google Sheet nebude dotknutý.)")) return;
    ["ms_settings","ms_ledger","ms_queue","ms_pass"].forEach(k=>localStorage.removeItem(k));
    location.reload();
  };
  ===== koniec zakomentovaných obslúh ===== */
}

/* ---------- tabs & init ---------- */
function renderCurrent(){
  if(currentTab==="meal") renderMeal();
  else if(currentTab==="balances") renderBalances();
  else renderSettings();
}
document.querySelector("nav").addEventListener("click", e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  currentTab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["meal","balances","settings"].forEach(t=>{ document.getElementById("tab-"+t).style.display = t===currentTab?"":"none"; });
  renderCurrent();
  if(currentTab==="balances") syncNow();
});
/* (i) info popups – delegated once here so re-rendering the form (which
   replaces the DOM) never loses or duplicates the listener. Positioning is
   pure CSS; the popup spans its row, so there is nothing to measure. */
document.addEventListener("click", e=>{
  const btn = e.target.closest(".info-ico");
  if(btn){
    const pop = btn.nextElementSibling;
    const wasOpen = pop.classList.contains("show");
    document.querySelectorAll(".info-pop.show").forEach(p=>p.classList.remove("show"));
    if(!wasOpen) pop.classList.add("show");
    return;
  }
  if(!e.target.closest(".info")) document.querySelectorAll(".info-pop.show").forEach(p=>p.classList.remove("show"));
});
window.addEventListener("online", syncNow);
setBadge(S.syncUrl?"sync":"local");
renderMeal(); renderBalances(); renderSettings();
syncNow();
</script>
</body>
</html>
